name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
      - run: npx expo export --platform android --output-dir .expo-ci/android --clear
      - run: npx expo export --platform ios --output-dir .expo-ci/ios --clear
